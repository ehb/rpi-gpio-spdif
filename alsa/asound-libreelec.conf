# ALSA configuration for rpi-gpio-spdif on systems where /usr/share/alsa/cards is
# read-only (LibreELEC: append to /storage/.config/asound.conf; elsewhere
# /etc/asound.conf). Same content as RPiGPIOSPDIF.conf, under the cards.<driver>
# node that alsa-lib maps the card number to.
#
# The generic iec958 definition is only pulled in by card files of S/PDIF cards (an
# HDMI-only system may not have it loaded), so include it here as such a card file
# would.
<confdir:pcm/iec958.conf>

cards.RPiGPIOSPDIF.pcm.iec958.0 {
  @args [ CARD AES0 AES1 AES2 AES3 ]
  @args.CARD { type string }
  @args.AES0 { type integer }
  @args.AES1 { type integer }
  @args.AES2 { type integer }
  @args.AES3 { type integer }
  type hooks
  slave.pcm {
    type hw
    card $CARD
    device 0
  }
  hooks.0 {
    type ctl_elems
    hook_args [
      {
        interface MIXER
        name "IEC958 Playback Default"
        lock true
        preserve true
        optional true
        value [ $AES0 $AES1 $AES2 $AES3 ]
      }
    ]
  }
}
