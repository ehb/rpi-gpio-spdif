name: libreelec-watch

# Weekly: a stable LibreELEC release without a zip on the newest GitHub Release of this
# repository gets one, built from that release's tag. A failure (for example a new kernel the
# driver does not build against) fails the run and opens an issue.
#
# GitHub disables schedules in public repositories after 60 days without activity, so the
# keepalive job re-enables this workflow on every run. If it was disabled anyway, use the
# "Enable workflow" button on the Actions tab. Notifications about scheduled runs go to
# whoever last edited the cron line.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.watch.outputs.tag }}
      versions: ${{ steps.watch.outputs.versions }}
      rev: ${{ steps.watch.outputs.rev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find LibreELEC releases without a zip
        id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ci/le_kernel.py watch | tee watch.out
          cat watch.out >> "$GITHUB_OUTPUT"
          TAG=$(sed -n 's/^tag=//p' watch.out)
          if [ -n "$TAG" ]; then
            echo "rev=$(python3 ci/le_kernel.py rev "$TAG")" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.versions != '[]' && needs.detect.outputs.versions != ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-addon.yml
    with:
      versions: ${{ needs.detect.outputs.versions }}
      ref: refs/tags/${{ needs.detect.outputs.tag }}
      rev: ${{ needs.detect.outputs.rev }}

  publish:
    needs: [detect, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: addon-*
          merge-multiple: true
      - name: Attach the new zips to the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: gh release upload "$TAG" dist/*.zip --clobber

  report-failure:
    needs: [detect, build, publish]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open an issue unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="libreelec-watch failed"
          OPEN=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq length)
          if [ "$OPEN" = 0 ]; then
            gh issue create --title "$TITLE" --body "Building for a new LibreELEC release failed: $RUN_URL"
          fi

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow so the schedule does not lapse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/libreelec-watch.yml/enable"
