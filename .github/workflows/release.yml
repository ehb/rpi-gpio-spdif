name: release

# A tag vX.Y.Z builds the add-on zip for every LibreELEC version listed in
# ci/libreelec-versions.txt and attaches them to the GitHub Release of that tag. Newer
# LibreELEC releases are not built here, so that a kernel the driver does not build against
# cannot block the release for the listed versions; libreelec-watch adds them later.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      rev: ${{ steps.plan.outputs.rev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions and add-on revision
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sh ci/release_notes.sh "${TAG#v}" > /dev/null
          echo "versions=$(python3 ci/le_kernel.py versions)" >> "$GITHUB_OUTPUT"
          echo "rev=$(python3 ci/le_kernel.py rev "$TAG")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-addon.yml
    with:
      versions: ${{ needs.prepare.outputs.versions }}
      ref: ${{ github.ref }}
      rev: ${{ needs.prepare.outputs.rev }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: addon-*
          merge-multiple: true
      - name: Create the release and attach the zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sh ci/release_notes.sh "${TAG#v}" > notes.md
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          gh release upload "$TAG" dist/*.zip --clobber
